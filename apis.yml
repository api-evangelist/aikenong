aid: aikenong
name: Aikenong
description: 'Aikenong (爱科农 / Beijing Aikenong Technology Co., Ltd., also trading internationally
  as ICAN) is a Chinese smart-agriculture company founded in 2016 in Chaoyang District, Beijing.
  It builds a proprietary plant-soil-atmosphere crop growth model and a data-driven agronomy
  platform (ICAN) that combines satellite and UAV remote sensing, weather and soil telemetry, and
  AI prediction into whole-season planting decision guidance for growers. Its product line spans
  the Aigengyun (爱耕耘) grower app and WeChat mini program, Aigengyun Enterprise and Business
  editions for farming enterprises and agri-input dealers, the AIGROW breeding information
  management system, a high-yield irrigation control system, and a catalogue of field hardware
  (weather stations, soil moisture stations, smart valves, fertigation controllers, greenhouse
  controllers, phenotyping cameras and inspection robots). The company reports service across
  roughly ten Chinese provinces and 30,000+ growers, and raised more than CNY 100 million in
  Series A/A+ rounds led by Source Code Capital, IDG Capital and GL Ventures. It is a SaaS and
  hardware vendor rather than an API vendor: no public developer program, API reference, SDK or
  machine-readable contract is published anywhere on its own domains as of this profile.'
